# Trimmed neofetch for the Beepy's 50x13 screen: no logo, short values, one screenful.
# The full default config is saved next to this file as config.conf.default-backup.

print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "CPU" cpu
    info "Memory" memory
    info "Disk" disk
    info "IP" local_ip
    prin "Battery" "$(cat /sys/firmware/beepy/battery_percent 2>/dev/null)% ($(cat /sys/firmware/beepy/battery_volts 2>/dev/null)V)"
}

image_backend="off"
distro_shorthand="on"
os_arch="off"
kernel_shorthand="on"
uptime_shorthand="tiny"
cpu_brand="off"
cpu_speed="on"
cpu_cores="off"
cpu_temp="C"
memory_percent="on"
disk_show=("/")
disk_subtitle="none"
